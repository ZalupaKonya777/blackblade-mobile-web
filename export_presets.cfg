[preset.0]
name="Web Mobile"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="mobile_web"
export_filter="all_resources"
include_filter="*.json,*.txt"
exclude_filter="tools/*,web/*,dist/*,artifacts/*,build/*,.runtime/*,.openai/*,.git/*,scenes/probe.tscn,scenes/roll_studio.tscn,scenes/beast_studio.tscn,scenes/balance_lab.tscn,scenes/weapon_studio.tscn,scenes/grip_review.tscn,assets/textures/*_albedo.jpg,assets/textures/*_ao.jpg,assets/textures/*_roughness.jpg,assets/textures/wall_*.jpg,assets/textures/floor_*.jpg,assets/textures/cathedral_reflection.hdr,assets/characters/*_basecolor.jpg,assets/characters/*_rm.jpg,assets/characters/boss.glb,assets/characters/knight.glb,assets/audio/*,assets/characters/boss_mobile_*_normal.png,assets/characters/knight_mobile_*_normal.png"
export_path="build/web/game.html"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

